# ============================================================
#  Przykładowy PLAN trybu autonomicznego (autorun)
# ============================================================
# Skopiuj do plans/<swoja-nazwa>.toml i dostosuj. Uruchomienie:
#   board-power-test autorun plans/nocny.toml
# (pliki *.example.toml są celowo pomijane na liście planów.)
#
# Plan = uporządkowana lista kroków. Każdy krok wskazuje scenariusz ze
# scenarios.toml (klucz sekcji [scenarios.<...>]) i mówi, JAK go
# zmierzyć: napięcie, ile mierzyć, kiedy zacząć, czy podglądać RTT,
# jak zapisać dane. Płytkę zasila i mierzy PPK2 (source meter) – nic
# nie robisz ręcznie, można zostawić na noc.

[plan]
name        = "nocny"
description  = "Nocna sesja porównawcza trybów snu"
board        = "btz"       # profil z [boards.*]; pusto = [defaults].profile
on_build_error = "skip"    # gdy build kroku padnie: skip = pomiń krok, abort = przerwij plan
on_step_error  = "skip"    # gdy padnie pomiar/trigger: skip = pomiń krok, abort = przerwij plan
ppk2_port    = ""          # pusto = autodetekcja; wpisz port, gdy masz kilka PPK2

# --- Krok 1: absolutne minimum snu, długi pomiar ---
[[plan.steps]]
scenario = "reset_only"
duration = "8h"                             # "45s" / "20m" / "8h" / "1h30m" / liczba sekund
voltage  = "3.0"                            # napięcie źródła PPK2 [V] – TWARDY limit 1.8–3.6 V
trigger  = { type = "delay", seconds = 20 } # zacznij mierzyć 20 s po flashu/resecie
rtt      = "off"                            # patrz "Tryby RTT" niżej – do minimów snu ZAWSZE off
sample_rate = 1000                          # próbki/s: 1/10/100/1000/10000/100000 (PPK2=100k, reszta = uśrednianie)
storage  = { mode = "downsampled", window_ms = 1 }  # min/avg/max co 1 ms (piki nie giną)
power_cycle = true                          # OFF/ON po flashu = czysty zimny start

# --- Krok 2: własna aplikacja, start po logu z RTT + auto-etykiety ---
[[plan.steps]]
scenario = "mesh-reliability-tester"
duration = "2h"
voltage  = "3.0"
# Zamiast stałego opóźnienia: czekaj, aż na konsoli RTT pojawi się log
# pasujący do wzorca (regex). timeout = ile czekać, zanim uznamy krok
# za nieudany (polityka on_step_error).
trigger  = { type = "rtt", pattern = "Friend established", timeout = "180s" }
rtt      = "continuous"                      # RTT podłączony przez cały pomiar (wymagane dla etykiet)
storage  = { mode = "both", window_ms = 1 }  # tiery + pełny raw (uwaga: raw ~1,4 GB/h!)
power_cycle = true
# build_extra_args = ["-DCONFIG_LOG=y"]      # doklejane ZA cmake_args scenariusza
# build_cmd = "west build -b {board} -d {build_dir} {src} -- -DCONFIG_X=y"
#   Pełny override komendy builda (shlex). Placeholdery {board}/{build_dir}/{src}
#   podstawia narzędzie. Wyklucza się z build_extra_args.

  # Auto-etykiety: linia RTT pasująca do `pattern` (regex) stawia znacznik
  # na wykresie. Działają TYLKO przy rtt = "continuous".
  [[plan.steps.labels]]
  pattern = "Friend Poll sent"
  label   = "Friend Poll"

  [[plan.steps.labels]]
  pattern = "Friend Update"
  label   = "Friend Update"

# --- Krok 3: aplikacja Matter – start pomiaru po 1. odczycie z subskrypcji ---
# Scenariusz "end_device" wskazuje na aplikację z sąsiedniego repo, więc jego
# wpis (z polem `source`) trzymamy w scenarios.local.toml – poza gitem.
[[plan.steps]]
scenario = "end_device"
duration = "20m"
voltage  = "3.0"
rtt      = "off"                             # do prądu snu; RTT dodaje narzut
# trigger 'chip': po flashu narzędzie samo robi (scripts/pair_and_subscribe.py):
#   rm /tmp/chip_* -> chip-tool pairing ble-thread -> interactive + subscribe.
# Pomiar PPK2 startuje 10 s po PIERWSZYM raporcie MeasuredValue (nie na
# sztywnym czasie) – te 10 s to zapas na uspokojenie się sieci po parowaniu.
# Z `icd_registration = true` zapas rośnie do 40 s: commissioning wysyła
# wtedy StayActive i węzeł pollue fast pollingiem jeszcze 30 s po parowaniu.
# `timeout` = ile czekać na tę pierwszą wartość (po sparowaniu).
trigger = { type = "chip", node_id = "5", discriminator = "3840", pin = "20202021", timeout = "120s", dataset = "0e08000000000001000000030000174a0300000e35060004001fffe00208813ba4b5a068fddf0708fddc8e685e36d6cc0510b840138392a6efbee61680bdca9ae7fd030f4f70656e5468726561642d666236650102fb6e04108c97ec5b81873b78c371537a24886bef0c0402a0f7f8" }
# Opcjonalne (mają sensowne domyślne):
#   cluster = "temperaturemeasurement"   attribute = "measured-value"
#   endpoint = "1"   min_interval = "1"   max_interval = "60"
#   match = "(?i)MeasuredValue[^0-9-]*(-?\\d+)"   # regex 1. wartości
#   chip_dir = "/home/goodbyte/KZ/connectedhomeip"   chip_tool = "..."
#   skip_pairing = true   # węzeł już w fabryce – tylko subskrypcja
#   no_wipe = true        # nie kasuj /tmp/chip_* przed parowaniem
#   icd_registration = true   # rejestracja klienta check-in (tryb LIT);
#                             # bez niej węzeł jedzie jako SIT
#   icd_stay_active_ms = 30000   # okno na subskrypcję po parowaniu

# ============================================================
#  Tryby RTT (pole `rtt`) – kompromis szum ↔ etykiety
# ============================================================
# RTT wymaga AKTYWNEJ sesji J-Link, a podłączony debugger DODAJE prąd.
#
#   off        – J-Link nieaktywny podczas pomiaru. Najniższy szum,
#                wyniki bliskie datasheetowi. Tylko trigger `delay`,
#                bez auto-etykiet. UŻYWAJ do absolutnych minimów snu.
#
#   trigger    – podłącz tylko po to, by złapać wzorzec startowy, potem
#                zamknij sesję J-Link PRZED oknem pomiaru. Zamknięcie nie
#                resetuje targetu, ale domena debug i sam kabel SWD mogą
#                jeszcze chwilę dodawać upływ – do prawdziwych podłóg snu
#                lepiej `off` + trigger `delay`.
#
#   continuous – J-Link podłączony przez cały pomiar. Auto-etykiety
#                działają, ale prąd zawiera narzut debuggera. Dobre do
#                pomiarów WZGLĘDNYCH i średnich (profil pracy), złe do
#                bezwzględnej podłogi snu.

# ============================================================
#  Zapis danych (pole `storage`)
# ============================================================
#   mode = "downsampled" – tylko tiery min/avg/max (małe pliki, pełny
#                          zoom nawet dla wielogodzinnych sesji). Domyślne.
#   mode = "raw"         – tylko surowe próbki 100 kS/s (float32,
#                          ~1,4 GB/h). Maksymalna dokładność.
#   mode = "both"        – oba naraz.
#   window_ms            – okno bazowego tieru (1 ms = piki widoczne).

# ============================================================
#  Trigger 'chip' (Matter: parowanie + subskrypcja)
# ============================================================
# Zamiast czekać sztywny `delay`, po flashu narzędzie:
#   1. kasuje stan fabryki chip-toola (rm -f /tmp/chip_*),
#   2. paruje węzeł:  chip-tool pairing ble-thread <node> hex:<dataset> <pin> <disc>,
#   3. otwiera subskrypcję atrybutu w trybie interaktywnym:
#        <cluster> subscribe <attribute> <min_interval> <max_interval> <node> <endpoint>
#   4. pomiar PPK2 startuje na PIERWSZYM raporcie (marker FIRST-VALUE).
# Subskrypcja zostaje OTWARTA przez cały pomiar i jest zamykana po jego końcu.
#
# Pola triggera:
#   node_id        (wymagane)  Node ID węzła, np. "5"
#   dataset        (do parow.) operational dataset Thread w hex (bez 'hex:')
#   discriminator  (do parow.) discriminator, np. "3840"
#   pin                        setup PIN code (domyślnie "20202021")
#   timeout                    ile czekać na 1. wartość PO sparowaniu (np. "120s")
#   cluster/attribute/endpoint domyślnie temperaturemeasurement/measured-value/1
#   min_interval/max_interval  interwały subskrypcji [s] (domyślnie 1/60)
#   match                      regex 1. wartości (domyślny łapie "MeasuredValue: N")
#   chip_dir/chip_tool         nadpisanie ścieżek (domyślne z pair_and_subscribe.py)
#   skip_pairing = true        węzeł już sparowany – pomiń krok parowania
#   no_wipe = true             nie kasuj /tmp/chip_* przed parowaniem
#
# Wymaga zbudowanego chip-toola w connectedhomeip oraz BLE (parowanie).
# Ręczny odpowiednik/podgląd:  scripts/pair_and_subscribe.py --help
