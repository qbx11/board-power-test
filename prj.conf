# ============================================================
#  nRF54L15 – obraz pomiarowy "rób dosłownie nic"
# ============================================================
# Baza wyłącza wszystko, co pobiera prąd w spoczynku. Wybór trybu
# snu jest w Kconfig (choice) i ustawiany przez -DCONFIG_SLEEP_...=y.
#
# Do sanity-checku dołóż fragment konfiguracji:
#   UART:  west build ... -- -DEXTRA_CONF_FILE=debug.conf
#   RTT :  west build ... -- -DEXTRA_CONF_FILE=debug_rtt.conf   (J-Link RTT Viewer)
# UWAGA: buildy debug włączają konsolę i PODNOSZĄ pobór — nie do pomiaru minimum.

# --- Konsola / serial / logi / RTT / shell: WYŁĄCZONE ---
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_SHELL=n
# PRINTK celowo NIE ustawiamy na 'n' — jądro i tak wymusza je na 'y' (byłby
# tylko warning). Nie szkodzi: bez backendu konsoli printk nie ma dokąd pisać,
# a APP_LOG w kodzie bramkujemy na CONFIG_CONSOLE, nie na PRINTK.

# GPIO celowo NIE ustawiamy tutaj: domyślnie jest wyłączone, a wariant
# SLEEP_SYSTEM_OFF_WAKE_GPIO włącza je przez `select GPIO` (patrz Kconfig).
