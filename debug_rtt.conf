# ============================================================
#  Fragment SANITY-CHECK przez RTT (J-Link RTT Viewer)
# ============================================================
# Kieruje logi na SEGGER RTT zamiast UART — do użycia z J-Link + RTT Viewer.
# Dołączaj przez:
#   west build ... -- -DEXTRA_CONF_FILE=debug_rtt.conf -DCONFIG_SLEEP_...=y
#
# UWAGA: to build DIAGNOSTYCZNY, NIE do pomiaru minimum. RTT wymaga aktywnego
# interfejsu debug (J-Link podłączony), co samo w sobie podnosi pobór. Pomiar
# prądu rób na obrazie BEZ tego fragmentu i z ODŁĄCZONYM J-Linkiem.

CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_HWINFO=y
