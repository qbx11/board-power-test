# ============================================================
#  Manifest scenariuszy pomiarowych (narzędzie tools/power-test)
# ============================================================
# Jeden wpis = jeden CZYSTY obraz firmware (build-time, jak dotąd)
# + notatki potrzebne przy pomiarze. Narzędzie NIE mierzy prądu
# (pomiar robisz w nRF Connect Power Profiler) i NICZEGO nie ocenia –
# pole "expected" jest tylko wyświetlane obok, do porównania
# z datasheetem na oko.
#
# Dodanie własnego scenariusza = skopiowanie wpisu (wzór na dole)
# albo szybciej: `board-power-test add <katalog-aplikacji | plik.hex>`
# (też przycisk "Dodaj kod" w interfejsie) – wpis dopisze się sam.

[defaults]
profile  = "btz"   # domyślny profil płytki (patrz [boards.*])
voltage  = "3.0"   # napięcie źródła PPK2 [V] – wyświetlane i zapisywane do CSV
settle_s = 5       # ile odczekać po odłączeniu SWD przed odczytem [s]

# --- Profile płytek -----------------------------------------
# W interfejsie płytka jest pokazywana przez oficjalny target (`board`);
# klucz sekcji (np. "btz") służy tylko do -p/--profile w CLI.
[boards.btz]
board      = "BTZ_EndDevice/nrf54l15/cpuapp"
runner     = "jlink"                                # west flash -r jlink (J-Link mini EDU)
board_root = "../NCS-Projects/Projekt-BLE-Mesh/app" # względem katalogu projektu; nadpisze env BOARD_ROOT

[boards.dk]
board = "nrf54l15dk/nrf54l15/cpuapp"
# DK: definicja płytki jest w SDK (bez board_root), debugger wbudowany (bez runnera).

# --- Scenariusze statyczne (pomiar samego prądu snu) --------
# `label` – nazwa w interfejsie; klucz sekcji identyfikuje scenariusz
# w CSV i CLI, więc nie zmieniaj go bez potrzeby.
[scenarios.reset_only]
label       = "Sen głęboki — minimum"
description = "System OFF, wybudzenie tylko resetem. Absolutne minimum poboru płytki."
cmake_args  = ["-DCONFIG_SLEEP_SYSTEM_OFF_RESET_ONLY=y"]
expected    = "~0.3-0.5 uA (System OFF bez retencji; DK zmierzone ~0.95 uA)"

[scenarios.idle]
label       = "Sen płytki — System ON"
description = "RTOS uśpiony, RAM i zegar RTC podtrzymane. Natychmiastowe wybudzenie."
cmake_args  = ["-DCONFIG_SLEEP_SYSTEM_ON_IDLE=y"]
expected    = "~1-2 uA (System ON IDLE, kolumna LFXO)"

[scenarios.wake_gpio]
label       = "Sen głęboki — wybudzanie przyciskiem"
description = "System OFF z wybudzeniem przyciskiem sw0 (SENSE), bez retencji RAM."
cmake_args  = ["-DCONFIG_SLEEP_SYSTEM_OFF_WAKE_GPIO=y"]
expected    = "jak 'Sen głęboki — minimum' + koszt SENSE"
note        = "Po pomiarze snu naciśnij sw0 – powinien być skok prądu (wybudzenie) i powrót do snu."

[scenarios.ram_retained]
label       = "Sen głęboki — z retencją RAM"
description = "System OFF z podtrzymaniem regionu RAM (devicetree, dom. 4 KB). Koszt utrzymania pamięci."
cmake_args  = ["-DCONFIG_SLEEP_SYSTEM_OFF_RAM_RETAINED=y"]
expected    = "wyżej niż minimum; rośnie z ilością utrzymywanego RAM"

# --- Scenariusze periodyczne (pomiar prądu ŚREDNIEGO) -------
[scenarios.periodic_on]
label       = "Praca cykliczna — ciepły start"
description = "Błysk aktywności co 10 s, między nimi sen w System ON (program kontynuuje)."
cmake_args  = [
  "-DCONFIG_SLEEP_PERIODIC_SYSTEM_ON=y",
  "-DCONFIG_PERIODIC_PERIOD_MS=10000",
  "-DCONFIG_PERIODIC_ACTIVE_MS=5",
]
expected    = "prąd ŚREDNI przez pełny cykl"
note        = "W Power Profiler uśredniaj przez kilka pełnych okresów T."

[scenarios.periodic_off]
label       = "Praca cykliczna — zimny start"
description = "Błysk aktywności co 10 s, sen w System OFF. Każde wybudzenie to reboot (budzik GRTC)."
cmake_args  = [
  "-DCONFIG_SLEEP_PERIODIC_SYSTEM_OFF=y",
  "-DCONFIG_PERIODIC_PERIOD_MS=10000",
  "-DCONFIG_PERIODIC_ACTIVE_MS=5",
]
expected    = "prąd ŚREDNI przez pełny cykl"
note        = "W Power Profiler uśredniaj przez kilka pełnych okresów T."

# --- Własne scenariusze (custom) ----------------------------
# Skopiuj wpis i zmień flagi; własny conf/overlay wrzuć do
# scenarios/custom/. Napięcie można nadpisać per scenariusz.
#
# [scenarios.moj_test]
# description = "System OFF + własny overlay z wyłączonym regulatorem X"
# cmake_args  = [
#   "-DCONFIG_SLEEP_SYSTEM_OFF_RESET_ONLY=y",
#   "-DEXTRA_CONF_FILE=scenarios/custom/moj_test.conf",
#   "-DDTC_OVERLAY_FILE=scenarios/custom/moj_test.overlay",
# ]
# expected    = "..."
# voltage     = "1.8"

# --- Własny firmware zespołu --------------------------------
# Dwa dodatkowe warianty wpisu (wykluczają się nawzajem i z powyższym):
#
# 1. `source` – zbuduj CUDZĄ aplikację Zephyr/NCS (katalog z własnym
#    CMakeLists.txt/prj.conf) zamiast firmware z tego repo. Ścieżka
#    względna (od katalogu repo) albo absolutna; katalog builda i tak
#    powstaje tutaj (build_<scenariusz>/). `cmake_args` opcjonalne.
#
# [scenarios.moja_aplikacja]
# label       = "Moja aplikacja — sen"
# description = "Build aplikacji zespołu i pomiar jak zwykle."
# source      = "../moj-projekt/app"
# cmake_args  = ["-DEXTRA_CONF_FILE=low_power.conf"]   # opcjonalne
# expected    = "..."
#
# 2. `hex` – GOTOWA binarka: FAZA 1 (build) jest pomijana, narzędzie
#    tylko wgrywa wskazany plik (nrfutil device program, z pełnym
#    kasowaniem jak przy --erase) i prowadzi przez pomiar.
#    `cmake_args` są przy `hex` zabronione.
#
# [scenarios.gotowy_obraz]
# label       = "Gotowy obraz — sen"
# description = "Pomiar obrazu zbudowanego poza narzędziem."
# hex         = "../moj-projekt/build/zephyr/zephyr.hex"
# expected    = "..."

[scenarios.blinky-advanced]
description = "Aplikacja z ../NCS-Projects/blinky-advanced (build przez west)."
source      = "../NCS-Projects/blinky-advanced"

[scenarios.mesh-reliability-tester]
description = "Aplikacja z ../mesh-reliability-tester (build przez west)."
source      = "../mesh-reliability-tester"
