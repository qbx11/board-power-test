# ============================================================
#  Fragment SANITY-CHECK (nie do pomiaru minimum!)
# ============================================================
# Włącza UART/konsolę i HWINFO, żeby po resecie wypisać wybrany tryb
# i przyczynę resetu. Dołączaj przez:
#   west build ... -- -DEXTRA_CONF_FILE=debug.conf -DCONFIG_SLEEP_...=y
#
# UWAGA: aktywny UART podnosi pobór o dziesiątki–setki µA — użyj tego
# TYLKO do potwierdzenia, że firmware działa i wchodzi w tryb, a pomiar
# minimum rób na obrazie bez tego fragmentu.

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_HWINFO=y
